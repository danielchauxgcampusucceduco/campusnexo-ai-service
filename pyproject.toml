[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "campusnexo-ai"
version = "0.2.0"
description = "Estimación de ocupación de CampusNexo: filtro de Kalman escalar sobre cámara, CO2 y Wi-Fi (heurística no calibrada)"
requires-python = ">=3.11"
# Exact versions: the same build today and on the day of the defense.
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.34.3",
    "pydantic==2.11.7",
    "numpy==2.2.6",
]

[project.optional-dependencies]
# YOLO person counting for /v1/vision/count (the backend does not call it; see README).
vision = ["ultralytics==8.3.150", "opencv-python-headless==4.11.0.86"]
test = ["pytest==8.4.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the eval tool as well as the app package.
pythonpath = ["."]
